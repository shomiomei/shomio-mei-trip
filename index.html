<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>しょうみおめい道中記</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: sans-serif;
  background: #f7f3ea;
  color: #333;
}

header {
  background: #6b8e23;
  color: white;
  padding: 22px 16px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 26px;
}

header p {
  margin: 6px 0 0;
  font-size: 14px;
}

main {
  padding: 16px;
  max-width: 600px;
  margin: auto;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.card h2 {
  margin-top: 0;
  font-size: 20px;
}

.button {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 12px;
  background: #8fae4f;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.button:active {
  transform: scale(0.98);
}

.info {
  background: #fff8d8;
  padding: 12px;
  border-radius: 10px;
  margin-top: 10px;
  line-height: 1.7;
}

footer {
  text-align: center;
  padding: 25px;
  font-size: 12px;
  color: #777;
}
</style>
</head>

<body>

<header>
  <h1>🚗 しょうみおめい道中記</h1>
  <p>家族5人の思い出旅行アルバム</p>
</header>

<main>

  <div class="card">
    <h2>📖 今回の旅</h2>
    <div class="info">
      <strong>山口家族旅行</strong><br>
      2026年9月12日（土）〜9月13日（日）
    </div>
  </div>

  <div class="card">
    <h2>🗺️ 旅のしおり</h2>
    <p>今回の旅行スケジュールを確認しよう！</p>
    <button class="button" onclick="alert('ここに旅行スケジュールを追加できます！')">
      スケジュールを見る
    </button>
  </div>

  <div class="card">
    <h2>📸 思い出アルバム</h2>
    <p>旅行中の写真や思い出を残そう！</p>
    <button class="button" onclick="alert('ここに写真アルバムを追加できます！')">
      アルバムを見る
    </button>
  </div>

  <div class="card">
    <h2>🎯 子どもチャレンジ</h2>
    <p>旅行中にミッションをクリアしよう！</p>
    <button class="button" onclick="alert('ミッションをクリアして思い出を集めよう！')">
      ミッションを見る
    </button>
  </div>

</main>

<footer>
  © 2026 しょうみおめい道中記
</footer>

</body>
</html>
